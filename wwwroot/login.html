<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>
    <div class="container" style="max-width: 420px;">
        <h3 class="mb-3">Đăng nhập</h3>
        <div id="alertBox"></div>

        <div class="card card-body">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input id="email" type="email" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input id="password" type="password" class="form-control">
            </div>
            <button class="btn btn-primary w-100" onclick="login()">Đăng nhập</button>
            <div class="text-center mt-3">Chưa có tài khoản? <a href="/register.html">Đăng ký</a></div>
        </div>

        <div class="small text-muted mt-3">
            <b>Tài khoản demo:</b><br>
            admin@hotel.com / Admin@123<br>
            manager@hotel.com / Manager@123<br>
            staff@hotel.com / Staff@123<br>
            customer@hotel.com / Customer@123
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
    // @ts-nocheck
    renderNavbar();

    async function login() {
        try {
            const data = await apiFetch('/api/auth/login', {
                method: 'POST',
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });
            saveSession(data);
            location.href = homeFor(data.role);
        } catch (e) {
            showAlert(e.message, 'danger');
        }
    }

    document.getElementById('password').addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
    });
    </script>
</body>
</html>
