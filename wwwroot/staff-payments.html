<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>
    <div class="container">
        <h3>Quản lý thanh toán</h3>
        <div id="alertBox"></div>

        <div class="row g-2 mb-3">
            <div class="col-md-3">
                <select id="statusFilter" class="form-select" onchange="load()">
                    <option value="">Tất cả trạng thái</option>
                    <option value="Pending">Chờ kết quả (cần đối soát)</option>
                    <option value="Paid">Thành công</option>
                    <option value="Failed">Thất bại</option>
                    <option value="Cancelled">Đã hủy</option>
                    <option value="Initiated">Đang thanh toán</option>
                </select>
            </div>
        </div>

        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr><th>Thời gian</th><th>Mã giao dịch</th><th>Booking</th><th>Khách hàng</th><th>Số tiền</th><th>Trạng thái</th><th>Ghi chú</th><th></th></tr>
            </thead>
            <tbody id="paymentTable"></tbody>
        </table>
        <div id="emptyMsg" class="text-muted"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
    // @ts-nocheck
    renderNavbar();

    const statusInfo = {
        Initiated: ['info', 'Đang thanh toán'],
        Pending:   ['warning', 'Chờ kết quả'],
        Paid:      ['success', 'Thành công'],
        Failed:    ['danger', 'Thất bại'],
        Cancelled: ['secondary', 'Đã hủy']
    };

    async function load() {
        const status = document.getElementById('statusFilter').value;
        try {
            const list = await apiFetch('/api/payments' + (status ? `?status=${status}` : ''));
            document.getElementById('emptyMsg').textContent = list.length ? '' : 'Không có giao dịch nào.';
            document.getElementById('paymentTable').innerHTML = list.map(p => {
                const [color, label] = statusInfo[p.status] || ['secondary', p.status];
                return `<tr>
                    <td class="text-nowrap">${new Date(p.createdAt).toLocaleString('vi-VN')}</td>
                    <td>${esc(p.transactionCode)}</td>
                    <td>${esc(p.bookingCode)}</td>
                    <td>${esc(p.customerName)}</td>
                    <td>${p.amount.toLocaleString('vi-VN')} đ</td>
                    <td><span class="badge bg-${color}">${label}</span></td>
                    <td class="small">${esc(p.message || '')}</td>
                    <td class="text-nowrap">${p.status === 'Pending' ? `
                        <button class="btn btn-sm btn-success" onclick="reconcile(${p.id}, true)">Đã nhận tiền</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="reconcile(${p.id}, false)">Không nhận được</button>` : ''}
                    </td>
                </tr>`;
            }).join('');
        } catch (e) {
            showAlert(e.message, 'danger');
        }
    }

    async function reconcile(id, success) {
        if (!confirm(success ? 'Xác nhận cổng thanh toán đã báo thu tiền thành công?' : 'Xác nhận giao dịch này thất bại?')) return;
        try {
            await apiFetch(`/api/payments/${id}/reconcile`, { method: 'POST', body: JSON.stringify({ success }) });
            showAlert('Đã đối soát giao dịch');
            load();
        } catch (e) {
            showAlert(e.message, 'danger');
        }
    }

    if (requireRole(['Staff', 'Manager'])) load();
    </script>
</body>
</html>
