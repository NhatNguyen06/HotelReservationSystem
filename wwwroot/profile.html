<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ cá nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>
    <div class="container" style="max-width: 480px;">
        <h3 class="mb-3">Hồ sơ cá nhân</h3>
        <div id="alertBox"></div>

        <div class="card card-body">
            <div class="mb-3"><label class="form-label">Email</label><input id="email" class="form-control" disabled></div>
            <div class="mb-3"><label class="form-label">Vai trò</label><input id="role" class="form-control" disabled></div>
            <div class="mb-3"><label class="form-label">Họ tên</label><input id="fullName" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Số điện thoại</label><input id="phone" class="form-control"></div>
            <button class="btn btn-primary" onclick="saveProfile()">Lưu thay đổi</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
    // @ts-nocheck
    renderNavbar();

    async function loadProfile() {
        try {
            const p = await apiFetch('/api/profile');
            document.getElementById('email').value = p.email;
            document.getElementById('role').value = p.role;
            document.getElementById('fullName').value = p.fullName;
            document.getElementById('phone').value = p.phone;
        } catch (e) {
            showAlert(e.message, 'danger');
        }
    }

    async function saveProfile() {
        try {
            const p = await apiFetch('/api/profile', {
                method: 'PUT',
                body: JSON.stringify({
                    fullName: document.getElementById('fullName').value,
                    phone: document.getElementById('phone').value
                })
            });
            // Cập nhật tên hiển thị trên thanh menu
            const user = getUser();
            user.fullName = p.fullName;
            localStorage.setItem('user', JSON.stringify(user));
            renderNavbar();
            showAlert('Đã cập nhật hồ sơ');
        } catch (e) {
            showAlert(e.message, 'danger');
        }
    }

    // Phải đăng nhập mới xem được
    if (getUser()) loadProfile(); else location.href = '/login.html';
    </script>
</body>
</html>
