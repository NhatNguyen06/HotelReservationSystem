<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hotel Reservation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>

    <div class="container">
        <h3 class="mb-3">Tìm phòng</h3>
        <div id="alertBox"></div>

        <div class="card card-body mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">Nhận phòng</label>
                    <input type="date" id="checkIn" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Trả phòng</label>
                    <input type="date" id="checkOut" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Số khách</label>
                    <input type="number" id="guests" class="form-control" value="2" min="1" max="10">
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" onclick="searchRooms()">Tìm phòng</button>
                </div>
            </div>
        </div>

        <div id="summary" class="text-muted mb-3"></div>
        <div id="results" class="row g-3"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
            // @ts-nocheck
            renderNavbar();
            function toDateString(d) {
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }
             
            // Mặc định: nhận hôm nay, trả ngày mai
            const today = new Date();
            const tomorrow = new Date();
            tomorrow.setDate(today.getDate() + 1);
            document.getElementById('checkIn').value = toDateString(today);
            document.getElementById('checkIn').min = toDateString(today);
            document.getElementById('checkOut').value = toDateString(tomorrow);
            document.getElementById('checkOut').min = toDateString(tomorrow);

            async function searchRooms() {
                const checkIn = document.getElementById('checkIn').value;
                const checkOut = document.getElementById('checkOut').value;
                const guests = document.getElementById('guests').value;

                if (!checkIn || !checkOut) {
                    showAlert('Vui lòng chọn ngày nhận và ngày trả phòng', 'warning');
                    return;
                }

                try {
                    document.getElementById('alertBox').innerHTML = '';
                    const rooms = await apiFetch(`/api/rooms/search?checkIn=${checkIn}&checkOut=${checkOut}&guests=${guests}`);

                    document.getElementById('summary').textContent = rooms.length
                        ? `Có ${rooms.length} phòng trống từ ${checkIn} đến ${checkOut}`
                        : '';

                    if (rooms.length === 0) {
                        document.getElementById('results').innerHTML =
                            '<div class="col-12"><div class="alert alert-warning">Không có phòng trống phù hợp. Hãy thử đổi ngày hoặc số khách.</div></div>';
                        return;
                    }

                    document.getElementById('results').innerHTML = rooms.map(r => `
                        <div class="col-md-4">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h5 class="card-title">${r.roomTypeName} - Phòng ${r.roomNumber}</h5>
                                    <p class="mb-1">Sức chứa: ${r.capacity} khách</p>
                                    <p class="text-muted small">${r.amenities}</p>
                                    <p class="mb-0">${r.basePrice.toLocaleString('vi-VN')} đ / đêm</p>
                                    <p class="fw-bold">${r.nights} đêm: ${r.totalPrice.toLocaleString('vi-VN')} đ</p>
                                </div>
                                <div class="card-footer bg-white">
                                    <a class="btn btn-outline-primary w-100"
                                       href="/room-detail.html?id=${r.id}&checkIn=${checkIn}&checkOut=${checkOut}&guests=${guests}">
                                       Xem chi tiết
                                    </a>
                                </div>
                            </div>
                        </div>`).join('');
                } catch (e) {
                    document.getElementById('results').innerHTML = '';
                    document.getElementById('summary').textContent = '';
                    showAlert(e.message, 'danger');
                }
            }
    </script>
</body>
</html>
