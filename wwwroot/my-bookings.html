<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Booking của tôi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>
    <div class="container">
        <h3>Booking của tôi</h3>
        <div id="alertBox"></div>

        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr><th>Mã</th><th>Phòng</th><th>Nhận</th><th>Trả</th><th>Khách</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr>
            </thead>
            <tbody id="bookingTable"></tbody>
        </table>
        <div id="emptyMsg" class="text-muted"></div>
    </div>

    <!-- Hộp thoại sửa booking -->
    <div class="modal fade" id="modifyModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Sửa booking <span id="modifyCode"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="modalAlert"></div>
                    <input type="hidden" id="modifyId">
                    <div class="mb-3"><label class="form-label">Nhận phòng</label><input type="date" id="mCheckIn" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">Trả phòng</label><input type="date" id="mCheckOut" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">Số khách</label><input type="number" id="mGuests" class="form-control" min="1" max="10"></div>
                    <div class="form-text">Chỉ được sửa nếu tổng tiền mới không cao hơn tổng tiền hiện tại.</div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button class="btn btn-primary" onclick="submitModify()">Lưu thay đổi</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
    // @ts-nocheck
    renderNavbar();
    let bookings = [];
    let modal;

    const statusInfo = {
        Pending:    ['warning', 'Chờ thanh toán'],
        Confirmed:  ['success', 'Đã xác nhận'],
        CheckedIn:  ['primary', 'Đang ở'],
        CheckedOut: ['secondary', 'Đã trả phòng'],
        Cancelled:  ['danger', 'Đã hủy'],
        Expired:    ['dark', 'Hết hạn giữ phòng']
    };

    async function loadBookings() {
        try {
            bookings = await apiFetch('/api/reservations/my');
            document.getElementById('emptyMsg').textContent = bookings.length ? '' : 'Bạn chưa có booking nào.';
            document.getElementById('bookingTable').innerHTML = bookings.map(b => {
                const [color, label] = statusInfo[b.status] || ['secondary', b.status];
                return `<tr>
                    <td>${esc(b.bookingCode)}</td>
                    <td>${esc(b.roomTypeName)} - Phòng ${esc(b.roomNumber)}</td>
                    <td>${esc(b.checkIn)}</td>
                    <td>${esc(b.checkOut)}</td>
                    <td>${b.guests}</td>
                    <td>${b.totalCost.toLocaleString('vi-VN')} đ</td>
                    <td><span class="badge bg-${color}">${label}</span></td>
                    <td class="text-nowrap">
                        ${b.canModify ? `<button class="btn btn-sm btn-outline-primary" onclick="openModify(${b.id})">Sửa</button>` : ''}
                        ${b.canCancel ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelBooking(${b.id})">Hủy</button>` : ''}
                        ${b.status === 'Pending' && !b.hasPendingPayment ? `<a class="btn btn-sm btn-success" href="/payment.html?reservationId=${b.id}">Thanh toán</a>` : ''}
                        ${b.hasPendingPayment ? '<span class="text-muted small">Đang chờ kết quả thanh toán</span>' : ''}
                    </td>
                </tr>`;
            }).join('');
        } catch (e) {
            showAlert(e.message, 'danger');
        }
    }

    async function cancelBooking(id) {
        const reason = prompt('Lý do hủy (có thể bỏ trống):');
        if (reason === null) return;   // bấm Cancel trong hộp thoại = không hủy (UC-009 A1)
        try {
            await apiFetch(`/api/reservations/${id}/cancel`, { method: 'POST', body: JSON.stringify({ reason }) });
            showAlert('Đã hủy booking');
            loadBookings();
        } catch (e) {
            showAlert(e.message, 'danger');
        }
    }

    function openModify(id) {
        const b = bookings.find(x => x.id === id);
        document.getElementById('modifyId').value = id;
        document.getElementById('modifyCode').textContent = b.bookingCode;
        document.getElementById('mCheckIn').value = b.checkIn;
        document.getElementById('mCheckOut').value = b.checkOut;
        document.getElementById('mGuests').value = b.guests;
        document.getElementById('modalAlert').innerHTML = '';
        modal.show();
    }

    async function submitModify() {
        const id = document.getElementById('modifyId').value;
        try {
            await apiFetch(`/api/reservations/${id}`, {
                method: 'PUT',
                body: JSON.stringify({
                    checkIn: document.getElementById('mCheckIn').value,
                    checkOut: document.getElementById('mCheckOut').value,
                    guests: parseInt(document.getElementById('mGuests').value)
                })
            });
            modal.hide();
            showAlert('Đã cập nhật booking');
            loadBookings();
        } catch (e) {
            document.getElementById('modalAlert').innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`;
        }
}
    if (requireRole(['Customer'])) {
        modal = new bootstrap.Modal(document.getElementById('modifyModal'));
        loadBookings();
    }

    </script>
</body>
</html>
