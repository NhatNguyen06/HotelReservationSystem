<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>
    <div class="container" style="max-width: 480px;">
        <h3 class="mb-3">Đăng ký tài khoản</h3>
        <div id="alertBox"></div>

        <div class="card card-body">
            <div class="mb-3"><label class="form-label">Họ tên</label><input id="fullName" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Email</label><input id="email" type="email" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Số điện thoại</label><input id="phone" class="form-control" placeholder="0901234567"></div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label><input id="password" type="password" class="form-control">
                <div class="form-text">Tối thiểu 8 ký tự, gồm cả chữ và số.</div>
            </div>
            <div class="mb-3"><label class="form-label">Xác nhận mật khẩu</label><input id="confirmPassword" type="password" class="form-control"></div>
            <button class="btn btn-primary w-100" onclick="register()">Đăng ký</button>
            <div class="text-center mt-3">Đã có tài khoản? <a href="/login.html">Đăng nhập</a></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
    // @ts-nocheck
    renderNavbar();

    async function register() {
        const val = id => document.getElementById(id).value;
        try {
            const data = await apiFetch('/api/auth/register', {
                method: 'POST',
                body: JSON.stringify({
                    fullName: val('fullName'), email: val('email'), phone: val('phone'),
                    password: val('password'), confirmPassword: val('confirmPassword')
                })
            });
            showAlert(data.message + ' Đang chuyển đến trang đăng nhập...');
            setTimeout(() => location.href = '/login.html', 1500);
        } catch (e) {
            showAlert(e.message, 'danger');
        }
    }
    </script>
</body>
</html>
