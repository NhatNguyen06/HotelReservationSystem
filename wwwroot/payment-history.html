<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lịch sử thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>
    <div class="container">
        <h3>Lịch sử thanh toán</h3>
        <div id="alertBox"></div>

        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr><th>Thời gian</th><th>Mã giao dịch</th><th>Booking</th><th>Phương thức</th><th>Số tiền</th><th>Trạng thái</th><th>Ghi chú</th></tr>
            </thead>
            <tbody id="paymentTable"></tbody>
        </table>
        <div id="emptyMsg" class="text-muted"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
    // @ts-nocheck
    renderNavbar();

    const statusInfo = {
        Initiated: ['info', 'Đang thanh toán'],
        Pending:   ['warning', 'Chờ kết quả'],
        Paid:      ['success', 'Thành công'],
        Failed:    ['danger', 'Thất bại'],
        Cancelled: ['secondary', 'Đã hủy']
    };
    const methodName = { CreditCard: 'Thẻ', EWallet: 'Ví điện tử' };

    async function load() {
        try {
            const list = await apiFetch('/api/payments/my');
            document.getElementById('emptyMsg').textContent = list.length ? '' : 'Bạn chưa có giao dịch nào.';
            document.getElementById('paymentTable').innerHTML = list.map(p => {
                const [color, label] = statusInfo[p.status] || ['secondary', p.status];
                return `<tr>
                    <td class="text-nowrap">${new Date(p.createdAt).toLocaleString('vi-VN')}</td>
                    <td>${esc(p.transactionCode)}</td>
                    <td>${esc(p.bookingCode)}</td>
                    <td>${methodName[p.method] || esc(p.method)}${p.cardLast4 ? ' ••••' + esc(p.cardLast4) : ''}</td>
                    <td>${p.amount.toLocaleString('vi-VN')} đ</td>
                    <td><span class="badge bg-${color}">${label}</span></td>
                    <td class="small">${esc(p.message || '')}</td>
                </tr>`;
            }).join('');
        } catch (e) {
            showAlert(e.message, 'danger');
        }
    }

    if (requireRole(['Customer'])) load();
    </script>
</body>
</html>
