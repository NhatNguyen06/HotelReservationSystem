<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>

    <div class="container">
        <h3>Quản lý phòng</h3>
        <div id="alertBox"></div>

        <div class="card card-body mb-4">
            <h6>Thêm phòng mới</h6>
            <div class="row g-2">
                <div class="col-md-4">
                    <input id="roomNumber" class="form-control" placeholder="Số phòng (VD: 401)">
                </div>
                <div class="col-md-4">
                    <select id="roomTypeId" class="form-select"></select>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary" onclick="addRoom()">Thêm phòng</button>
                </div>
            </div>
        </div>

        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Số phòng</th>
                    <th>Loại phòng</th>
                    <th>Giá</th>
                    <th>Sức chứa</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="roomTable"></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
                            renderNavbar(); 
                            const statuses = ['Available', 'Occupied', 'NeedsCleaning'];

                            async function loadRoomTypes() {
                                const types = await apiFetch('/api/room-types');
                                document.getElementById('roomTypeId').innerHTML =
                                    types.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
                            }

                            async function loadRooms() {
                                try {
                                    const rooms = await apiFetch('/api/rooms');
                                    document.getElementById('roomTable').innerHTML = rooms.map(r => `
                                        <tr>
                                            <td>${r.roomNumber}</td>
                                            <td>${r.roomTypeName}</td>
                                            <td>${r.basePrice.toLocaleString('vi-VN')} đ</td>
                                            <td>${r.capacity}</td>
                                            <td>
                                                <select class="form-select form-select-sm" onchange="changeStatus(${r.id}, this.value)">
                                                    ${statuses.map(s => `<option ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}
                                                </select>
                                            </td>
                                            <td><button class="btn btn-sm btn-outline-danger" onclick="deleteRoom(${r.id})">Xóa</button></td>
                                        </tr>`).join('');
                                } catch (e) {
                                    showAlert(e.message, 'danger');
                                }
                            }

                            async function addRoom() {
                                try {
                                    await apiFetch('/api/rooms', {
                                        method: 'POST',
                                        body: JSON.stringify({
                                            roomNumber: document.getElementById('roomNumber').value,
                                            roomTypeId: parseInt(document.getElementById('roomTypeId').value)
                                        })
                                    });
                                    showAlert('Đã thêm phòng');
                                    document.getElementById('roomNumber').value = '';
                                    loadRooms();
                                } catch (e) {
                                    showAlert(e.message, 'danger');
                                }
                            }

                            async function changeStatus(id, status) {
                                try {
                                    await apiFetch(`/api/rooms/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status }) });
                                    showAlert('Đã cập nhật trạng thái');
                                } catch (e) {
                                    showAlert(e.message, 'danger');
                                    loadRooms();
                                }
                            }

                            async function deleteRoom(id) {
                                if (!confirm('Xóa phòng này?')) return;
                                try {
                                    await apiFetch(`/api/rooms/${id}`, { method: 'DELETE' });
                                    showAlert('Đã xóa phòng');
                                    loadRooms();
                                } catch (e) {
                                    showAlert(e.message, 'danger');
                                }
                            }
            if (requireRole(['Staff', 'Manager'])) {
            loadRoomTypes();
            loadRooms();
}
    </script>
</body>
</html>
